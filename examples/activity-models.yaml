schema_version: "veriforge-model-matrix/v2"
task_id: "example-activity-v1"
policy: fixed_for_task_version

# Organizer-owned activity policy. Participants receive the completed file and
# may select one model, but may not add models or change profiles/parameters.
organizer_controls:
  model_matrix_locked: true
  participant_model_choice_only: true
  fixed_model_count: 5
  fixed_profile_only: true
  credential_mode: per_selected_model
  approved_model_ids:
    - "kimi-k3"
    - "deepseek-v4-pro"
    - "qwen3.8-max"
    - "claude-opus-5"
    - "gpt-5.6-sol"

selection:
  mode: participant_selects_one
  allow_participant_model_choice: true
  allow_participant_profile_choice: false
  allow_custom_parameters: false
  max_models_per_run: 1
  fixed_profile: default

# Activity matrix v1. These five IDs and profiles are fixed by the organizer.
# Participants choose only one model and a rollout count.
models:
  - id: "claude-opus-5"
    display_name: "Claude Opus 5"
    provider: "wodex"
    adapter: "anthropic_messages"
    model_name: "claude-opus-5"
    endpoint: "messages"
    base_url: "https://api.wodex.ai"
    credential_env: "WODEX_API_KEY"
    supported_harnesses: ["cc"]
    trace:
      mode: "native_cli_stream"
      streaming: true
      tool_calls: true
      normalized_events: true
    profiles:
      - id: "default"
        parameters:
          reasoning_effort: "max"
          max_output_tokens: 32768
        timeout_seconds: 7200
        retries: 0

  - id: "gpt-5.6-sol"
    display_name: "GPT-5.6 Sol"
    provider: "wodex"
    adapter: "openai_responses"
    model_name: "gpt-5.6-sol"
    endpoint: "responses"
    base_url: "https://api.wodex.ai/v1"
    credential_env: "WODEX_API_KEY"
    supported_harnesses: ["codex"]
    codex_model_provider: "wodex"
    codex_base_url: "https://api.wodex.ai/v1"
    trace:
      mode: "native_cli_stream"
      streaming: true
      tool_calls: true
      normalized_events: true
    profiles:
      - id: "default"
        parameters:
          # gpt-5.6-sol 的最高推理档是 xhigh，没有 max 档。
          reasoning_effort: "xhigh"
          max_output_tokens: 32768
        timeout_seconds: 7200
        retries: 0

  # Qwen 走主办方 MaaS 实例的 Anthropic 兼容端点，只支持 CC。
  # 路径是 /apps/anthropic，且不能以 /v1 结尾，否则 CC 会拼出 /v1/v1/models。
  - id: "qwen3.8-max"
    display_name: "Qwen3.8 Max"
    provider: "aliyun_maas"
    adapter: "anthropic_messages"
    model_name: "qwen3.8-max"
    endpoint: "messages"
    base_url: "https://llm-fw3e7y0h6s1otsjx.cn-beijing.maas.aliyuncs.com/apps/anthropic"
    credential_env: "DASHSCOPE_API_KEY"
    supported_harnesses: ["cc"]
    trace:
      mode: "native_cli_stream"
      streaming: true
      tool_calls: true
      normalized_events: true
    profiles:
      - id: "default"
        parameters:
          reasoning_effort: "max"
          max_output_tokens: 32768
        timeout_seconds: 7200
        retries: 0

  # Kimi 是矩阵中的例外：只支持 CC，不支持 Codex。
  # Codex 仅接受 Responses 协议，而 Moonshot 的 OpenAI 端点是 Chat Completions，
  # 直连必然 404；官方 Anthropic 兼容端点可以让 CC 直接使用，无需本地转换层。
  # 该端点上的模型 ID 是 kimi-k3[1m]，与 OpenAI 端点的 kimi-k3 不同。
  - id: "kimi-k3"
    display_name: "K3"
    provider: "moonshot"
    adapter: "anthropic_messages"
    model_name: "kimi-k3[1m]"
    endpoint: "messages"
    base_url: "https://api.moonshot.cn/anthropic"
    credential_env: "MOONSHOT_API_KEY"
    supported_harnesses: ["cc"]
    trace:
      mode: "native_cli_stream"
      streaming: true
      tool_calls: true
      normalized_events: true
    profiles:
      - id: "default"
        parameters:
          reasoning_effort: "max"
          max_output_tokens: 32768
        timeout_seconds: 7200
        retries: 0

  # DeepSeek 走官方 Anthropic 兼容端点，只支持 CC。
  # 该端点上的模型 ID 是 deepseek-v4-pro[1m]。
  - id: "deepseek-v4-pro"
    display_name: "DeepSeek V4 Pro"
    provider: "deepseek"
    adapter: "anthropic_messages"
    model_name: "deepseek-v4-pro[1m]"
    endpoint: "messages"
    base_url: "https://api.deepseek.com/anthropic"
    credential_env: "DEEPSEEK_API_KEY"
    supported_harnesses: ["cc"]
    trace:
      mode: "native_cli_stream"
      streaming: true
      tool_calls: true
      normalized_events: true
    profiles:
      - id: "default"
        parameters:
          reasoning_effort: "max"
          max_output_tokens: 32768
        timeout_seconds: 7200
        retries: 0

roll_policy:
  min_rolls: 1
  default_rolls: 3
  max_rolls: 10
  max_parallelism: 2
