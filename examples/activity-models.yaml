schema_version: "veriforge-model-matrix/v2"
task_id: "example-activity-v1"
policy: fixed_for_task_version

# Organizer-owned activity policy. Participants receive the completed file and
# may select one model, but may not add models or change profiles/parameters.
organizer_controls:
  model_matrix_locked: true
  participant_model_choice_only: true
  fixed_model_count: 5
  fixed_profile_only: true
  credential_mode: per_selected_model
  approved_model_ids:
    - "kimi-k3"
    - "deepseek-v4-pro"
    - "qwen3.8-max"
    - "claude-opus-5"
    - "gpt-5.6-sol"

selection:
  mode: participant_selects_one
  allow_participant_model_choice: true
  allow_participant_profile_choice: false
  allow_custom_parameters: false
  max_models_per_run: 1
  fixed_profile: default

# Activity matrix v1. These five IDs and profiles are fixed by the organizer.
# Participants choose only one model and a rollout count.
models:
  - id: "claude-opus-5"
    display_name: "Claude Opus 5"
    provider: "anthropic"
    adapter: "anthropic_messages"
    model_name: "claude-opus-5"
    endpoint: "messages"
    base_url: "https://api.anthropic.com"
    credential_env: "ANTHROPIC_API_KEY"
    profiles:
      - id: "default"
        parameters:
          reasoning_effort: "max"
          max_output_tokens: 32768
        timeout_seconds: 1800
        retries: 0

  - id: "gpt-5.6-sol"
    display_name: "GPT-5.6 Sol"
    provider: "openai"
    adapter: "openai_responses"
    model_name: "gpt-5.6-sol"
    endpoint: "responses"
    base_url: "https://api.openai.com/v1"
    credential_env: "OPENAI_API_KEY"
    profiles:
      - id: "default"
        parameters:
          reasoning_effort: "max"
          max_output_tokens: 32768
        timeout_seconds: 1800
        retries: 0

  - id: "qwen3.8-max"
    display_name: "Qwen3.8 Max"
    provider: "qwen"
    adapter: "openai_chat"
    model_name: "qwen3.8-max"
    endpoint: "chat_completions"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    credential_env: "DASHSCOPE_API_KEY"
    profiles:
      - id: "default"
        parameters:
          reasoning_effort: "max"
          max_output_tokens: 32768
        timeout_seconds: 1800
        retries: 0

  - id: "kimi-k3"
    display_name: "K3"
    provider: "moonshot"
    adapter: "openai_chat"
    model_name: "kimi-k3"
    endpoint: "chat_completions"
    base_url: "https://api.moonshot.ai/v1"
    credential_env: "MOONSHOT_API_KEY"
    profiles:
      - id: "default"
        parameters:
          reasoning_effort: "max"
          max_output_tokens: 32768
        timeout_seconds: 1800
        retries: 0

  - id: "deepseek-v4-pro"
    display_name: "DeepSeek V4 Pro"
    provider: "deepseek"
    adapter: "openai_responses"
    model_name: "deepseek-v4-pro"
    endpoint: "responses"
    base_url: "https://api.deepseek.com"
    credential_env: "DEEPSEEK_API_KEY"
    profiles:
      - id: "default"
        parameters:
          reasoning_effort: "max"
          max_output_tokens: 32768
        timeout_seconds: 1800
        retries: 0

roll_policy:
  min_rolls: 1
  default_rolls: 3
  max_rolls: 10
  max_parallelism: 2
